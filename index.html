<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BB RIGHT — เสียงของทุกคน</title>
<meta name="description" content="พื้นที่ปลอดภัยแบบไม่ระบุตัวตน ให้นักเรียนทุกคนเสนอไอเดีย โหวต และประเมินกิจกรรม เพื่อโรงเรียนที่ดีขึ้น" />
<meta name="theme-color" content="#16304F" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // ตั้งธีมก่อนวาดหน้า กันจอกะพริบ
  (function(){
    var t=null;
    try{ t=JSON.parse(localStorage.getItem('bb_theme')); }catch(e){}
    if(!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root{
  color-scheme:light;
  --bg:#FBF8F3; --surface:#FFFFFF; --surface2:#F6F1E9; --ink:#1C2733; --ink2:#3B4858; --muted:#657285; --line:#E9E2D6;
  --brand:#D9560F; --brand-d:#BC4709; --brand-soft:#FFEBDD; --on-brand:#FFFFFF;
  --navy:#16304F; --navy2:#24507F;
  --ok:#17825A; --ok-soft:#DFF5EC; --warn:#9A6212; --warn-soft:#FFF1CF; --bad:#C93A4F; --bad-soft:#FDE4E8;
  --sky:#2F86C0; --sky-soft:#E1F1FB; --mark-add:#CDEFDD; --mark-del:#FBD5DA;
  --shadow:0 1px 2px rgba(22,48,79,.06),0 10px 28px rgba(22,48,79,.08);
  --shadow-s:0 1px 2px rgba(22,48,79,.08);
  --r:18px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1520; --surface:#152233; --surface2:#1A2B3F; --ink:#EEF2F7; --ink2:#CBD5E1; --muted:#9AAABE; --line:#263A52;
  --brand:#FF8442; --brand-d:#FF9A63; --brand-soft:#3B2618; --on-brand:#1A0E05;
  --navy:#0A1422; --navy2:#17314F;
  --ok:#4ACB95; --ok-soft:#15352A; --warn:#F2C35B; --warn-soft:#3A2E12; --bad:#FF7F90; --bad-soft:#3E1B22;
  --sky:#62B8EC; --sky-soft:#142F43; --mark-add:#1E4A39; --mark-del:#59242E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.6;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));transition:background .25s,color .25s;}
body.lock{overflow:hidden;}
h1,h2,h3,h4,.disp{font-family:'Kanit','Sarabun',sans-serif;font-weight:600;line-height:1.3;margin:0;}
p{margin:0;}
button,input,textarea,select{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--brand);}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px;border-radius:10px;}
.ic{width:18px;height:18px;flex-shrink:0;display:inline-block;vertical-align:middle;}
.ic.on{fill:currentColor;}
.shell{max-width:1120px;margin:0 auto;padding:0 16px;}
.muted{color:var(--muted);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);}
.topbar-in{display:flex;align-items:center;gap:14px;height:64px;}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;text-align:left;}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(150deg,var(--navy2),var(--navy));display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 14px rgba(10,22,38,.25);}
.logo svg{width:25px;height:25px;}
.brand b{font-family:'Kanit';font-size:19px;letter-spacing:.3px;display:block;line-height:1.1;}
.brand b i{font-style:normal;color:var(--brand);}
.brand small{font-size:12px;color:var(--muted);display:block;line-height:1.2;}
.dnav{display:none;margin-left:auto;gap:4px;}
.dnav button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:9px 14px;border-radius:999px;color:var(--ink2);font-weight:500;font-size:15px;}
.dnav button:hover{background:var(--surface2);}
.dnav button.active{background:var(--navy);color:#fff;}
[data-theme="dark"] .dnav button.active{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2);flex-shrink:0;}
.icon-btn:hover{background:var(--surface2);}
.icon-btn.small{width:34px;height:34px;border-radius:10px;border:0;background:transparent;}
.topbar .icon-btn{margin-left:auto;}
.dnav + .icon-btn{margin-left:6px;}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:0;background:none;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:500;min-width:0;}
.bnav button .ic{width:22px;height:22px;}
.bnav button.active{color:var(--brand);background:var(--brand-soft);}
@media (min-width:760px){ .dnav{display:flex;} .bnav{display:none;} body{padding-bottom:40px;} }

/* ---------- hero ---------- */
.hero{margin-top:18px;border-radius:26px;padding:26px 22px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(520px 260px at 92% -10%,rgba(242,107,33,.55),transparent 70%),radial-gradient(420px 240px at -5% 110%,rgba(79,169,220,.45),transparent 70%),linear-gradient(160deg,#16304F,#24507F);
  display:grid;gap:20px;}
.hero h1{font-size:clamp(26px,5.4vw,40px);font-weight:700;}
.hero h1 span{color:#FFB27F;display:block;}
.hero p{color:#D5E0EE;max-width:46ch;margin-top:8px;}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.hstat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 12px;}
.hstat b{font-family:'Kanit';font-size:24px;display:block;line-height:1.1;}
.hstat span{font-size:12px;color:#D5E0EE;}
@media (min-width:860px){ .hero{grid-template-columns:1.25fr 1fr;align-items:center;padding:34px 36px;} }

/* ---------- layout ---------- */
.layout{display:grid;gap:22px;margin-top:22px;}
.layout>*,.controls>*{min-width:0;}
@media (min-width:980px){ .layout{grid-template-columns:minmax(0,1fr) 330px;align-items:start;} .side{position:sticky;top:84px;} }
.side{display:none;gap:14px;}
@media (min-width:980px){ .side{display:grid;} }
.page-head{margin:24px 0 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;}
.page-head h2{font-size:26px;}
.page-head p{color:var(--muted);font-size:14.5px;margin-top:2px;}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-s);}
.card h3{font-size:17px;}
.stack{display:grid;gap:14px;}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.row.sb{justify-content:space-between;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:999px;padding:10px 20px;font-weight:600;font-size:15px;
  transition:transform .12s,background .15s,box-shadow .15s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--brand);color:var(--on-brand);box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 32%,transparent);}
.btn.primary:hover{background:var(--brand-d);}
.btn.line{background:var(--surface);border-color:var(--line);color:var(--ink);}
.btn.line:hover{border-color:var(--ink2);}
.btn.soft{background:var(--brand-soft);color:var(--brand);}
.btn.glass{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff;}
.btn.glass:hover{background:rgba(255,255,255,.22);}
.btn.danger{background:var(--bad-soft);color:var(--bad);}
.btn.sm{padding:7px 14px;font-size:13.5px;}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--ink2);border:1px solid transparent;white-space:nowrap;}
.chip .ic{width:14px;height:14px;}
.chip.ok{background:var(--ok-soft);color:var(--ok);} .chip.warn{background:var(--warn-soft);color:var(--warn);}
.chip.bad{background:var(--bad-soft);color:var(--bad);} .chip.brand{background:var(--brand-soft);color:var(--brand);}
.chip.hero-chip{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.25);}
.chip.cat{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--ink));}
.field,select.field{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:11px 14px;outline:none;transition:border-color .15s,box-shadow .15s;}
.field:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent);}
textarea.field{resize:vertical;min-height:110px;line-height:1.6;}
label.lbl{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px;color:var(--ink2);}
.hint{font-size:12.5px;color:var(--muted);margin-top:5px;}
.err{color:var(--bad);font-size:13.5px;margin-top:8px;font-weight:500;}
.counter{float:right;font-weight:400;}
.empty{text-align:center;color:var(--muted);padding:38px 14px;border:1.5px dashed var(--line);border-radius:var(--r);}
.empty b{display:block;font-size:34px;margin-bottom:4px;}

/* ---------- feed ---------- */
.controls{display:grid;gap:12px;}
@media (min-width:640px){ .controls{grid-template-columns:auto 1fr;align-items:center;} }
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:4px;gap:2px;overflow:auto;}
.seg button{flex:1;border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap;}
.seg button.active{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-s);}
.search{position:relative;display:block;}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);}
.search input{padding-left:42px;border-radius:999px;}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;}
.chips-scroll::-webkit-scrollbar{display:none;}
.fchip{flex-shrink:0;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--ink2);}
.fchip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
[data-theme="dark"] .fchip.active{background:var(--brand);border-color:var(--brand);color:var(--on-brand);}
.list{display:grid;gap:14px;margin-top:10px;}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px;box-shadow:var(--shadow-s);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;}
.idea:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--brand) 35%,var(--line));}
.idea.top1{border-color:#E9B949;}
.idea-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.idea h3{font-size:18px;margin:10px 0 4px;}
.idea .txt{color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word;}
.idea-foot{display:flex;align-items:center;gap:14px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);}
.idea-foot .meta{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;color:var(--muted);}
.idea-foot .sp{margin-left:auto;}
.up{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 11px;font-weight:700;color:var(--ink2);}
.up:hover{border-color:var(--brand);color:var(--brand);}
.up.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand);}
.up.pop{animation:pop .35s;}
@keyframes pop{40%{transform:scale(1.18);}}
.medal{font-size:19px;line-height:1;}
.sk{height:132px;border-radius:var(--r);background:linear-gradient(100deg,var(--surface2) 30%,var(--surface) 50%,var(--surface2) 70%);background-size:200% 100%;animation:sh 1.3s linear infinite;}
@keyframes sh{to{background-position:-200% 0;}}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:44;width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;
  box-shadow:0 10px 26px color-mix(in srgb,var(--brand) 45%,transparent);}
.fab .ic{width:26px;height:26px;}
@media (min-width:760px){ .fab{display:none;} }

/* side */
.rules{display:grid;gap:10px;margin:12px 0 0;padding:0;list-style:none;font-size:14.5px;color:var(--ink2);}
.rules li{display:flex;gap:10px;align-items:flex-start;}
.rules .em{width:30px;height:30px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;flex-shrink:0;font-size:15px;}
.mini{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;}
.mini:first-of-type{border-top:0;}
.mini b{font-size:14.5px;display:block;line-height:1.4;}
.mini small{color:var(--muted);}

/* ---------- polls ---------- */
.poll h3{font-size:19px;}
.opt{display:flex;width:100%;text-align:left;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 15px;margin-top:9px;font-weight:500;transition:border-color .15s,background .15s;}
.opt:hover{border-color:var(--brand);background:var(--brand-soft);}
.opt .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;}
.opt:hover .rad{border-color:var(--brand);}
.res{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2);margin-top:9px;padding:11px 14px;display:flex;justify-content:space-between;gap:10px;font-weight:500;}
.res .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--c) 26%,transparent);transition:width .6s cubic-bezier(.2,.8,.2,1);}
.res>*{position:relative;}
.res.mine{box-shadow:inset 0 0 0 2px var(--c);}
.res .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px;}
.donut-wrap{display:grid;gap:16px;align-items:center;}
@media (min-width:560px){ .donut-wrap{grid-template-columns:190px 1fr;} }
.donut{width:190px;height:190px;margin:0 auto;display:block;}
.donut text{font-family:'Kanit';fill:var(--ink);}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:600;}
.live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;}
@keyframes pulse{50%{opacity:.25;}}

/* ---------- events ---------- */
.stars{display:flex;gap:6px;margin:6px 0;}
.star{border:0;background:none;padding:2px;color:var(--line);transition:transform .1s;}
.star .ic{width:36px;height:36px;stroke-width:1.5;}
.star.on{color:#F2A91B;} .star:hover{transform:scale(1.12);}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.tagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;}
.tagbtn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600;}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.cmp>div{background:var(--surface2);border-radius:16px;padding:12px 14px;text-align:center;}
.cmp b{font-family:'Kanit';font-size:30px;display:block;line-height:1.1;}
.cmp small{color:var(--muted);}
.delta{font-weight:700;font-size:13.5px;}
.delta.up1{color:var(--ok);} .delta.dn{color:var(--bad);}
.dist{display:grid;gap:5px;margin-top:12px;}
.dist .r{display:grid;grid-template-columns:20px 1fr 28px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);}
.dist .t{height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;} .dist .t i{display:block;height:100%;background:#F2A91B;border-radius:6px;}
.phase{display:flex;gap:6px;flex-wrap:wrap;}

/* ---------- rank ---------- */
.podium{display:grid;gap:14px;}
@media (min-width:760px){ .podium{grid-template-columns:1fr 1.12fr 1fr;align-items:end;} .podium .p1{order:2;} .podium .p2{order:1;} .podium .p3{order:3;} }
.pod{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px;text-align:center;box-shadow:var(--shadow-s);position:relative;display:flex;flex-direction:column;gap:6px;}
.pod .big{font-size:44px;line-height:1;}
.pod.p1{background:linear-gradient(180deg,color-mix(in srgb,#F2B233 22%,var(--surface)),var(--surface));border-color:#E9B949;padding-top:30px;padding-bottom:26px;}
.pod h3{font-size:17px;cursor:pointer;} .pod h3:hover{color:var(--brand);}
.pod .pts{font-family:'Kanit';font-size:15px;color:var(--brand);font-weight:600;}
.pod .v{font-size:13.5px;color:var(--muted);}
.steps{counter-reset:s;display:grid;gap:10px;margin:12px 0 0;padding:0;list-style:none;}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--ink2);}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;display:grid;place-items:center;flex-shrink:0;font-size:13px;}

/* ---------- council ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (min-width:760px){ .tiles{grid-template-columns:repeat(4,1fr);} }
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;}
.tile b{font-family:'Kanit';font-size:28px;display:block;line-height:1.1;}
.tile span{font-size:13px;color:var(--muted);}
.bars{display:grid;gap:9px;margin-top:12px;}
.bar{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:13.5px;}
@media (min-width:560px){ .bar{grid-template-columns:130px 1fr 30px;} }
.bar .t{height:11px;border-radius:7px;background:var(--surface2);overflow:hidden;} .bar .t i{display:block;height:100%;border-radius:7px;transition:width .5s;}
.bar b{text-align:right;}
.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);}
.item:first-child{border-top:0;}
.item .tt{font-weight:600;line-height:1.4;}
.hidden-post{opacity:.55;}
.login{max-width:420px;margin:26px auto;text-align:center;}
.login .big{width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 12px;}
.login .big .ic{width:32px;height:32px;}
.subnav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;}
.subnav::-webkit-scrollbar{display:none;}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:flex-start;}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:80;background:rgba(8,16,28,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;}
.ov.l2{z-index:95;}
@keyframes fade{from{opacity:0;}}

function cyrb53(str, seed=0){
  let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }

  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}

function checkText(...parts){
  const raw = parts.join("\n");
  const n = normText(raw);
  let bad = BAD_TH.some(re=>re.test(n)) || BAD_EN.some(w=>n.includes(w));
  const names = [];
  for(const m of raw.matchAll(NAME_RE)){
    const nm = m[2];
    if(NAME_STOP.some(s=>nm.startsWith(s))) continue;
    names.push((m[1]+" "+nm).replace(/\s+/g," "));
  }
  for(const m of raw.matchAll(NAME_EN)) names.push(m[0]);
  return { bad, names:[...new Set(names)] };
}

/* word diff for edit history */
function tokens(s){
  try{ if(Intl.Segmenter) return [...new Intl.Segmenter("th",{granularity:"word"}).segment(s)].map(x=>x.segment); }catch{}
  return [...s];
}
function diffHTML(a, b){
  const A=tokens(a), B=tokens(b), n=A.length, m=B.length;
  if(n*m>300000) return { a:esc(a), b:esc(b) };
  const dp=new Uint16Array((n+1)*(m+1)), W=m+1;
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i*W+j] = A[i]===B[j] ? dp[(i+1)*W+j+1]+1 : Math.max(dp[(i+1)*W+j], dp[i*W+j+1]);
  let i=0,j=0; const ra=[], rb=[];
  const push=(arr,t,k)=>{ if(arr.length && arr[arr.length-1].k===k) arr[arr.length-1].t+=t; else arr.push({t,k}); };
  while(i<n && j<m){
    if(A[i]===B[j]){ push(ra,A[i],0); push(rb,B[j],0); i++; j++; }
    else if(dp[(i+1)*W+j] >= dp[i*W+j+1]){ push(ra,A[i++],1); }
    else { push(rb,B[j++],1); }
  }
  while(i<n) push(ra,A[i++],1); while(j<m) push(rb,B[j++],1);
  const out=(arr,cls)=>arr.map(x=>x.k?`<mark class="${cls}">${esc(x.t)}</mark>`:esc(x.t)).join("");
  return { a:out(ra,"del"), b:out(rb,"add") };
}

function showModal(html, wide=false){
  $("#modal-root").innerHTML = `<div class="ov" data-action="ovclose"><div class="sheet ${wide?"wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  lockBody();
}
function closeModal(){
  if(commentsUnsub){ commentsUnsub(); commentsUnsub=null; }
  S.modal=null; S.comments=[]; $("#modal-root").innerHTML=""; lockBody();
}
function ask({title, body, ok="ตกลง", cancel="ยกเลิก", danger=false}){
  return new Promise(res=>{
    const root=$("#modal-root2");
    root.innerHTML = `<div class="ov l2"><div class="sheet" role="alertdialog" aria-modal="true">
      <h2 class="disp" style="font-size:20px;margin-bottom:8px;">${esc(title)}</h2>
      <div class="body-txt" style="margin-bottom:18px;">${body}</div>
      <div class="row" style="justify-content:flex-end;">
        <button class="btn line" id="askNo">${esc(cancel)}</button>
        <button class="btn ${danger?"danger":"primary"}" id="askYes">${esc(ok)}</button></div></div></div>`;
    lockBody();
    const done=v=>{ root.innerHTML=""; lockBody(); res(v); };
    $("#askNo").onclick=()=>done(false); $("#askYes").onclick=()=>done(true);
    $("#askYes").focus();
  });
}
/* ผ่านตัวกรองหรือไม่ — true = โพสต์ต่อได้ */
async function passFilter(...parts){
  const r = checkText(...parts);
  if(r.bad){ toast("พบคำที่ไม่เหมาะสม โปรดปรับถ้อยคำให้สุภาพก่อนส่ง", true); return false; }
  if(r.names.length){
    return ask({ title:"พบข้อความที่คล้ายชื่อบุคคล",
      body:`<p>เพื่อป้องกันการกลั่นแกล้ง ระบบพบข้อความที่อาจเป็นชื่อจริง: <b>${r.names.map(esc).join(", ")}</b></p>
            <p class="muted" style="margin-top:6px;">แนะนำให้เปลี่ยนเป็นตำแหน่ง/วิชา/กลุ่ม เช่น “ครูวิชาคณิต” แทนชื่อ ถ้าไม่ใช่ชื่อคน สามารถส่งต่อได้</p>`,
      ok:"ไม่ใช่ชื่อคน ส่งต่อ", cancel:"กลับไปแก้ไข" });
  }
  return true;
}

function subscribeIdeas(){
  unsubs.filter(u=>u.k==="ideas").forEach(u=>u.f()); unsubs = unsubs.filter(u=>u.k!=="ideas");
  const f = onSnapshot(query(collection(db,"ideas"), where("round","==",activeRound)), snap=>{
    S.ideas = snap.docs.map(d=>({id:d.id,...d.data()})); S.loaded.ideas=true; patchModalIdea(); refresh();
  }, e=>{ S.loaded.ideas=true; fail(e); refresh(); });
  unsubs.push({k:"ideas",f});
}
function subscribeAll(){
  subscribeIdeas();
  unsubs.push({k:"polls", f:onSnapshot(collection(db,"polls"), snap=>{
    S.polls = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0)); S.loaded.polls=true; refresh();
  }, e=>{ S.loaded.polls=true; fail(e); })});
  unsubs.push({k:"events", f:onSnapshot(collection(db,"events"), snap=>{
    S.events = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0)); S.loaded.events=true; refresh();
  }, e=>{ S.loaded.events=true; fail(e); })});
  unsubs.push({k:"settings", f:onSnapshot(doc(db,"settings","main"), snap=>{
    S.settings = snap.exists()?snap.data():{}; refresh();
  }, ()=>{})});
  unsubs.push({k:"me", f:onSnapshot(doc(db,"users",S.uid), snap=>{
    const d = snap.exists()?snap.data():{};
    S.me = { upvoted:d.upvoted||{}, votedPolls:d.votedPolls||{}, rated:d.rated||{}, quota:d.quota||{} }; S.loaded.me=true; refresh();
  }, ()=>{ S.loaded.me=true; })});
}
const getIdea = id => S.ideas.find(i=>i.id===id) || (S.prev||[]).find(i=>i.id===id) || (S.modal && S.modal.idea && S.modal.idea.id===id ? S.modal.idea : null);
const visible = () => S.ideas.filter(i=>!i.hidden);
const quotaUsed = () => !!(S.me.quota[activeRound] || LS.get("bb_posted",null)===activeRound);
const isMine = id => !!S.codes[id];
function rankedTop(list){ return [...list].filter(i=>!i.hidden).sort((a,b)=>(b.votes||0)-(a.votes||0)||(a.ts||0)-(b.ts||0)); }
function trendScore(i){ const h=(Date.now()-i.ts)/36e5; return ((i.votes||0)+1+(i.comments||0)*.5)/Math.pow(h+2,1.4); }
function sortIdeas(list, mode){
  const a=[...list];
  if(mode==="latest") return a.sort((x,y)=>y.ts-x.ts);
  if(mode==="trending") return a.sort((x,y)=>trendScore(y)-trendScore(x));
  return a.sort((x,y)=>(y.votes||0)-(x.votes||0)||x.ts-y.ts);
}
const pollTotal = p => Object.values(p.counts||{}).reduce((a,b)=>a+(b||0),0);
const evAvg = (ev,ph) => { const s=ev.stats?.[ph]; return s&&s.n ? s.sum/s.n : null; };

async function toggleUpvote(id){
  if(!S.uid) return;
  const ref=doc(db,"ideas",id), vref=doc(db,"ideas",id,"votes",S.uid), uref=doc(db,"users",S.uid);
  const had = !!S.me.upvoted[id];
  // optimistic
  const i=getIdea(id); if(i){ i.votes=(i.votes||0)+(had?-1:1); }
  if(had) delete S.me.upvoted[id]; else S.me.upvoted[id]=true;
  refresh(); patchModalIdea();
  try{
    await runTransaction(db, async tx=>{
      const v = await tx.get(vref);
      if(v.exists()){ tx.delete(vref); tx.update(ref,{votes:increment(-1)}); tx.set(uref,{upvoted:{[id]:deleteField()}},{merge:true}); }
      else { tx.set(vref,{ts:Date.now()}); tx.update(ref,{votes:increment(1)}); tx.set(uref,{upvoted:{[id]:true}},{merge:true}); }
    });
  }catch(e){ fail(e); }
}
async function shareIdea(id){
  const i=getIdea(id); const url = location.href.split("#")[0]+"#idea="+id;
  if(navigator.share){
    try{ await navigator.share({ title:"BB RIGHT — "+(i?.title||"ไอเดีย"), text:i?.title||"", url }); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  toast((await copyText(url)) ? "คัดลอกลิงก์แล้ว" : "คัดลอกไม่สำเร็จ", false);
}
async function submitIdea(form){
  const d=S.draft.compose;
  const title=d.title.trim(), text=d.text.trim();
  const err=$("#cErr"); err.textContent="";
  if(quotaUsed()){ err.textContent="คุณส่งข้อเสนอในรอบนี้ไปแล้ว (1 คน ส่งได้ 1 ข้อเสนอต่อรอบ)"; return; }
  if(title.length<4){ err.textContent="หัวข้อสั้นเกินไป (อย่างน้อย 4 ตัวอักษร)"; return; }
  if(text.length<15){ err.textContent="ช่วยอธิบายเพิ่มอีกนิด (อย่างน้อย 15 ตัวอักษร)"; return; }
  if(!(await passFilter(title,text))) return;
  const btn=$("#cBtn"); btn.disabled=true;
  try{
    const ideaRef=doc(collection(db,"ideas")), id=ideaRef.id, code=genCode(), ch=await codeHash(id,code);
    const qref=doc(db,"quotas",`${activeRound}_${S.uid}`), uref=doc(db,"users",S.uid);
    await runTransaction(db, async tx=>{
      const q=await tx.get(qref); if(q.exists()) throw new Error("QUOTA");
      tx.set(qref,{ideaId:id,ts:Date.now()});
      tx.set(ideaRef,{ title, text, cat:d.cat, votes:0, comments:0, round:activeRound, ts:Date.now(), history:[], ch, a:anonTag(S.uid,id) });
      tx.set(uref,{quota:{[activeRound]:id}},{merge:true});
    });
    S.codes[id]=code; LS.set("bb_codes",S.codes); LS.set("bb_posted",activeRound);
    S.me.quota[activeRound]=id; S.draft.compose={title:"",text:"",cat:"study"};
    openCodeModal(id, code); refresh();
  }catch(e){
    if(String(e.message).includes("QUOTA")){ LS.set("bb_posted",activeRound); err.textContent="คุณส่งข้อเสนอในรอบนี้ไปแล้ว"; refresh(); }
    else fail(e);
    btn.disabled=false;
  }
}
async function submitEdit(form){
  const id=S.modal.id, i=getIdea(id); if(!i) return;
  const code=$("#eCode").value, title=$("#eTitle").value.trim(), text=$("#eText").value.trim(), err=$("#eErr"); err.textContent="";
  if(Date.now()-i.ts > CFG.EDIT_MIN*60000){ err.textContent="เลยเวลาแก้ไข 30 นาทีแล้ว"; return; }
  if(title.length<4||text.length<15){ err.textContent="กรอกหัวข้อ (≥4 ตัวอักษร) และรายละเอียด (≥15 ตัวอักษร)"; return; }
  if((await codeHash(id,code)) !== i.ch){ err.textContent="Secret Code ไม่ถูกต้อง"; return; }
  if(title===i.title && text===i.text){ err.textContent="ยังไม่มีการเปลี่ยนแปลง"; return; }
  if(!(await passFilter(title,text))) return;
  try{
    const history=[...(i.history||[]),{title:i.title,text:i.text,ts:i.editedAt||i.ts}];
    await updateDoc(doc(db,"ideas",id),{title,text,history,editedAt:Date.now()});
    S.codes[id]=normCode(code)?code:S.codes[id]; LS.set("bb_codes",S.codes);
    toast("แก้ไขเรียบร้อย ✏️"); openDetail(id);
  }catch(e){ fail(e); }
}
async function submitComment(form){
  const id=S.modal.id, inp=$("#cmText"), text=inp.value.trim();
  if(text.length<2) return;
  if(Date.now()-S.lastComment<15000){ toast("รอสักครู่ก่อนคอมเมนต์ถัดไป", true); return; }

    b.set(cref,{text,ts:Date.now(),a:anonTag(S.uid,id)}); b.update(doc(db,"ideas",id),{comments:increment(1)});
    await b.commit(); inp.value=""; S.lastComment=Date.now();
  }catch(e){ fail(e); }
}

/* ลบโพสต์ถาวร: ลบโหวตและคอมเมนต์ทั้งหมดด้วย คะแนนจึงหายไปทั้งหมด */
async function purgeIdea(id){
  for(const sub of ["votes","comments"]){
    const snap=await getDocs(collection(db,"ideas",id,sub));
    for(let k=0;k<snap.docs.length;k+=400){ const b=writeBatch(db); snap.docs.slice(k,k+400).forEach(d=>b.delete(d.ref)); await b.commit(); }
  }
  await deleteDoc(doc(db,"ideas",id));
  delete S.codes[id]; LS.set("bb_codes",S.codes); delete S.me.upvoted[id];
}
async function confirmDelete(id){
  const i=getIdea(id); if(!i) return;
  const ok=await ask({title:"ลบโพสต์นี้ถาวร?",
    body:`<p><b>${esc(i.title)}</b></p><p class="muted" style="margin-top:6px;">คะแนนโหวต ${i.votes||0} คะแนน และคอมเมนต์ ${i.comments||0} รายการจะหายไปทั้งหมด และกู้คืนไม่ได้</p>${quotaNote(i)}`,
    ok:"ลบถาวร", danger:true});
  if(!ok) return;
  try{ await purgeIdea(id); closeModal(); toast("ลบโพสต์แล้ว"); refresh(); }catch(e){ fail(e); }
}

async function votePoll(pid, oid){
  const p=S.polls.find(x=>x.id===pid); if(!p||S.me.votedPolls[pid]) return;
  const pref=doc(db,"polls",pid), vref=doc(db,"polls",pid,"votes",S.uid), uref=doc(db,"users",S.uid);
  try{
    await runTransaction(db, async tx=>{
      const v=await tx.get(vref); if(v.exists()) throw new Error("DUP");
      tx.set(vref,{opt:oid,ts:Date.now()});
      tx.update(pref,{[`counts.${oid}`]:increment(1)});
      tx.set(uref,{votedPolls:{[pid]:oid}},{merge:true});
    });
    S.me.votedPolls[pid]=oid; toast("โหวตเรียบร้อย ขอบคุณที่ร่วมแสดงความเห็น"); refresh();
  }catch(e){ if(String(e.message).includes("DUP")) toast("คุณโหวตเรื่องนี้ไปแล้ว",true); else fail(e); }
}
async function submitRating(evId, phase){
  const key=`${evId}_${phase}`, stars=S.draft.stars[key]||0;
  if(S.me.rated[key]) return;
  if(!stars){ toast("กรุณาเลือกจำนวนดาวก่อน",true); return; }
  const comment=($(`#evc-${key}`)?.value||"").trim(), tags=Object.keys(S.draft.tags[key]||{}).filter(k=>S.draft.tags[key][k]);
  if(comment && !(await passFilter(comment))) return;
  try{
    const eref=doc(db,"events",evId), rref=doc(db,"events",evId,"responses",`${S.uid}_${phase}`), uref=doc(db,"users",S.uid);
    await runTransaction(db, async tx=>{
      const ex=await tx.get(rref); if(ex.exists()) throw new Error("DUP");
      tx.set(rref,{phase,stars,comment,tags,ts:Date.now()});
      const upd={[`stats.${phase}.n`]:increment(1),[`stats.${phase}.sum`]:increment(stars),[`stats.${phase}.s${stars}`]:increment(1)};
      tags.forEach(t=>{ upd[`tagc.${phase}_${t}`]=increment(1); });
      tx.update(eref,upd); tx.set(uref,{rated:{[key]:true}},{merge:true});
    });
    S.me.rated[key]=true; toast("ส่งความพึงพอใจแล้ว ขอบคุณมาก 💛"); refresh();
  }catch(e){ if(String(e.message).includes("DUP")) toast("คุณประเมินช่วงนี้ไปแล้ว",true); else fail(e); }
}

  const pin=S.draft.pin; const h=await sha256("bbright-council:"+pin);
  const target = S.settings.councilPinHash || await sha256("bbright-council:"+CFG.DEFAULT_PIN);
  if(h===target){ S.council=true; try{sessionStorage.setItem("bb_council","1");}catch{} S.draft.pin=""; S.draft.pinErr=""; toast("เข้าสู่โหมดสภานักเรียนแล้ว"); }
  else S.draft.pinErr="รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง";
  renderView();
}

/* ---- polls ---- */
function donutSVG(p){
  const tot=pollTotal(p), R=70, C=2*Math.PI*R; let acc=0;
  const segs=tot? p.options.map((o,k)=>{ const v=p.counts?.[o.id]||0, len=v/tot*C;
    const s=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${POLL_COLORS[k%6]}" stroke-width="30" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>`; acc+=len; return v?s:""; }).join("")
    : `<circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--line)" stroke-width="30"/>`;
  return `<svg class="donut" viewBox="0 0 200 200" role="img" aria-label="ผลโหวต">${segs}<text x="100" y="104" text-anchor="middle" font-size="34" font-weight="600">${tot}</text><text x="100" y="128" text-anchor="middle" font-size="13" style="fill:var(--muted)">โหวต</text></svg>`;
}
function pollCard(p){
  const my=S.me.votedPolls[p.id], ended=p.status==="ended", tot=pollTotal(p), show=my||ended||S.council;
  const legend=p.options.map((o,k)=>{ const v=p.counts?.[o.id]||0, pct=tot?Math.round(v/tot*100):0, c=POLL_COLORS[k%6];
    return `<div class="res ${my===o.id?"mine":""}" style="--c:${c}"><span class="fill" style="width:${pct}%"></span><span><i class="dot"></i>${esc(o.text)}${my===o.id?" ✓":""}</span><b>${pct}% <small class="muted">(${v})</small></b></div>`; }).join("");
  return `<article class="card poll">
    <div class="row sb"><span class="chip ${ended?"":"ok"}">${ended?"ปิดโหวตแล้ว":"กำลังเปิดโหวต"}</span>${show&&!ended?'<span class="live">ผลแบบเรียลไทม์</span>':""}</div>
    <h3 style="margin-top:10px;">${esc(p.title)}</h3>${p.desc?`<p class="muted" style="margin-top:4px;">${esc(p.desc)}</p>`:""}
    ${show ? `
      <div class="row" style="margin-top:12px;"><div class="seg" style="display:inline-flex;"><button class="${S.pollView==="donut"?"active":""}" data-action="pollview" data-v="donut">โดนัท</button><button class="${S.pollView==="bar"?"active":""}" data-action="pollview" data-v="bar">แท่ง</button></div></div>
      ${S.pollView==="donut" ? `<div class="donut-wrap" style="margin-top:12px;">${donutSVG(p)}<div>${legend}</div></div>` : `<div style="margin-top:6px;">${legend}</div>`}
      <p class="hint">รวม ${tot} โหวต${!my&&!ended&&S.council?" · (คุณกำลังดูในโหมดสภา)":""}</p>`
    : `<div style="margin-top:6px;">${p.options.map(o=>`<button class="opt" data-action="vote" data-pid="${p.id}" data-oid="${o.id}"><span class="rad"></span>${esc(o.text)}</button>`).join("")}</div>
       <p class="hint">โหวตได้คนละ 1 ครั้ง ผลจะแสดงทันทีหลังโหวต · ไม่เปิดเผยตัวตน</p>`}
  </article>`;
}
function pollsView(){

const phaseLabel={before:"ก่อนงาน",after:"หลังงาน",closed:"ปิดแล้ว"};
function starsHTML(key){
  const v=S.draft.stars[key]||0;
  return `<div class="stars" role="radiogroup" aria-label="ให้คะแนน">${[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=v?"on":""}" data-action="star" data-key="${key}" data-n="${n}" aria-label="${n} ดาว">${ic("star",n<=v?"on":"")}</button>`).join("")}</div>`;
}
function distHTML(s){
  if(!s||!s.n) return ""; const mx=Math.max(1,...[1,2,3,4,5].map(k=>s["s"+k]||0));
  return `<div class="dist">${[5,4,3,2,1].map(k=>`<div class="r"><span>${k}★</span><span class="t"><i style="width:${(s["s"+k]||0)/mx*100}%"></i></span><span>${s["s"+k]||0}</span></div>`).join("")}</div>`;
}
function eventCard(ev){
  const ph=ev.phase||"before", key=`${ev.id}_${ph}`, done=!!S.me.rated[key], b=evAvg(ev,"before"), a=evAvg(ev,"after");
  const q = ph==="before" ? "คุณคาดหวังกับงานนี้แค่ไหน?" : "หลังจบงาน คุณพึงพอใจแค่ไหน?";
  const canRate = ph!=="closed" && !done;
  const showStats = S.council || ph==="closed" || done || (ph==="after" && S.me.rated[`${ev.id}_before`]);
  let delta="";
  if(b!=null && a!=null){ const d=a-b; delta=`<span class="delta ${d>=0?"up1":"dn"}">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(1)}</span>`; }
  return `<article class="card" id="ev-${ev.id}">
    <div class="row sb"><span class="chip ${ph==="closed"?"":"brand"}">${ph==="closed"?"ปิดรับแล้ว":"เปิดรับ: "+phaseLabel[ph]}</span>${ev.date?`<span class="muted" style="font-size:13.5px;">${ic("event")} ${fmtDate(new Date(ev.date).getTime())}</span>`:""}</div>
    <h3 style="margin-top:10px;font-size:20px;">${esc(ev.name)}</h3>${ev.desc?`<p class="muted" style="margin-top:3px;">${esc(ev.desc)}</p>`:""}
    ${canRate ? `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;">
        <b>${q}</b>${starsHTML(key)}
        ${ph==="after"?`<div class="tagrow">${EV_TAGS.map(([k,l])=>`<button type="button" class="tagbtn ${S.draft.tags[key]?.[k]?"on":""}" data-action="evtag" data-key="${key}" data-t="${k}">${l}</button>`).join("")}</div><p class="hint">เลือกสิ่งที่ประทับใจ (เลือกได้หลายข้อ)</p>`:""}
        <textarea id="evc-${key}" class="field" rows="2" style="min-height:70px;margin-top:10px;" maxlength="300" placeholder="${ph==="before"?"อยากให้งานนี้เป็นแบบไหน (ไม่บังคับ)":"มีอะไรอยากบอกผู้จัดไหม (ไม่บังคับ)"}"></textarea>
        <div style="margin-top:10px;"><button class="btn primary" data-action="rate" data-ev="${ev.id}" data-ph="${ph}">${ic("send")} ส่งความพึงพอใจ</button></div>
      </div>` : (done?`<p class="chip ok" style="margin-top:12px;">${ic("check")} คุณประเมินช่วง “${phaseLabel[ph]}” แล้ว ขอบคุณ</p>`:"")}
    ${showStats && (b!=null||a!=null) ? `<div class="cmp">
        <div><small>ก่อนงาน${ev.stats?.before?.n?` · ${ev.stats.before.n} คน`:""}</small><b>${b!=null?b.toFixed(1):"–"}</b></div>
        <div><small>หลังงาน${ev.stats?.after?.n?` · ${ev.stats.after.n} คน`:""}</small><b>${a!=null?a.toFixed(1):"–"}</b>${delta}</div></div>
        ${distHTML(ev.stats?.[ph==="before"?"before":"after"]||ev.stats?.after||ev.stats?.before)}`
      : (showStats?'<p class="hint" style="margin-top:10px;">ยังไม่มีคะแนนจากผู้ร่วมงาน</p>':'<p class="hint" style="margin-top:10px;">ส่งคะแนนแล้วจะเห็นผลสรุปของทุกคน</p>')}
  </article>`;
}

function renderView(){
  S.dirty=false;
  const v=$("#view");
  v.innerHTML = ({feed:feedView,polls:pollsView,events:eventsView,rank:rankView,council:councilView})[S.tab]();
  if(S.tab==="feed") updateFeedList();

}
function refresh(){
  if(S.tab==="feed"){ updateFeedList(); updateHero(); return; }
  const a=document.activeElement;
  if(a && $("#view").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ S.dirty=true; return; }
  renderView();
}

  },()=>{});

  <div class="voucher"><div style="font-size:42px;">${["🥇","🥈","🥉"][(rank||1)-1]}</div><b>+${CFG.POINTS[(rank||1)-1]} แต้มบุญ</b>
    <div style="margin-top:6px;">${esc(i.title)}</div><div style="font-size:13px;color:#BCD0E6;margin-top:8px;">รหัสอ้างอิง ${esc(i.id.slice(0,8).toUpperCase())} · ยืนยันเมื่อ ${fmtDT(ts)}</div></div>
  <p class="hint" style="margin-top:12px;text-align:center;">แสดงหน้าจอนี้ให้สภานักเรียน เพื่อรับรางวัล</p>`);
}
async function openEvComments(id){
  const ev=S.events.find(e=>e.id===id); S.modal={type:"evc",id};
  showModal(`<div class="sheet-head"><h2 class="disp">💬 ความเห็น: ${esc(ev?.name||"")}</h2><button class="icon-btn" data-action="close" aria-label="ปิด">${ic("x")}</button></div><div id="evcBody"><div class="sk"></div></div>`,true);
  try{
    const s=await getDocs(collection(db,"events",id,"responses")); const rs=s.docs.map(d=>d.data()).filter(r=>r.comment||(r.tags||[]).length).sort((a,b)=>b.ts-a.ts);
    const tl=Object.fromEntries(EV_TAGS);
    $("#evcBody").innerHTML = rs.length ? rs.map(r=>`<div class="item"><div><div>${"★".repeat(r.stars)}<span class="muted">${"★".repeat(5-r.stars)}</span> <span class="chip">${phaseLabel[r.phase]||r.phase}</span></div>
      ${r.comment?`<p style="margin-top:4px;white-space:pre-wrap;">${esc(r.comment)}</p>`:""}${(r.tags||[]).length?`<small class="muted">${r.tags.map(t=>esc(tl[t]||t)).join(" · ")}</small>`:""}</div><small class="muted">${timeAgo(r.ts)}</small></div>`).join("")
      : '<p class="muted">ยังไม่มีความเห็น</p>';
  }catch(e){ fail(e); }
}

/* =====================================================================
   event delegation
   ===================================================================== */
const ACT = {
  tab:el=>setTab(el.dataset.tab),
  theme:()=>{ const t=document.documentElement.dataset.theme==="dark"?"light":"dark"; document.documentElement.dataset.theme=t; LS.set("bb_theme",t); buildNav(); },
  compose:openCompose, rules:openRules, close:closeModal,
  ccat:el=>{ S.draft.compose.cat=el.dataset.v; $("#cCats").querySelectorAll(".tagbtn").forEach(b=>b.classList.toggle("on",b.dataset.v===el.dataset.v)); },
  sort:el=>{ S.sort=el.dataset.v; renderView(); },
  cat:el=>{ S.cat=el.dataset.v; S.mine=false; renderView(); },
  mine:()=>{ S.mine=!S.mine; renderView(); },
  open:el=>openDetail(el.dataset.id),
  detail:el=>openDetail(el.dataset.id),
  upvote:el=>{ toggleUpvote(el.dataset.id); el.classList.add("pop"); },
  share:el=>shareIdea(el.dataset.id),
  history:el=>openHistory(el.dataset.id), edit:el=>openEdit(el.dataset.id),
  claim:el=>openClaim(el.dataset.id, +el.dataset.rank),
  delidea:el=>{ S.council ? confirmDelete(el.dataset.id) : openDelete(el.dataset.id); },
  copycode:async el=>toast((await copyText(el.dataset.code))?"คัดลอกรหัสแล้ว":"คัดลอกไม่สำเร็จ"),
  delcm:el=>deleteComment(el.dataset.id),
  vote:el=>votePoll(el.dataset.pid, el.dataset.oid),
  pollview:el=>{ S.pollView=el.dataset.v; renderView(); },
  star:el=>{ const k=el.dataset.key,n=+el.dataset.n; S.draft.stars[k]=n;
    el.closest(".stars").querySelectorAll(".star").forEach((b,idx)=>{ const on=idx<n; b.classList.toggle("on",on); b.firstElementChild.classList.toggle("on",on); }); },
  evtag:el=>{ const k=el.dataset.key,t=el.dataset.t; (S.draft.tags[k]??={})[t]=!S.draft.tags[k][t]; el.classList.toggle("on",!!S.draft.tags[k][t]); },
  rate:el=>submitRating(el.dataset.ev, el.dataset.ph),
  rankview:async el=>{ S.rankView=el.dataset.v; if(S.rankView==="prev") S.prev=null; renderView(); },
  cview:el=>{ S.cview=el.dataset.v; renderView(); },
  clogout:councilLogout,
  addopt:()=>{ S.draft.pollOpts.push(""); renderView(); }, rmopt:el=>{ S.draft.pollOpts.splice(+el.dataset.i,1); renderView(); },
  createpoll:createPoll, createev:createEvent, savepin:savePin, saverewards:saveRewards,
  pollstatus:el=>upd("polls",el.dataset.id,{status:el.dataset.v},el.dataset.v==="ended"?"ปิดโหวตแล้ว":"เปิดโหวตอีกครั้ง"),
  delpoll:async el=>{ if(await ask({title:"ลบประชามตินี้?",body:"ผลโหวตทั้งหมดจะหายไป",ok:"ลบ",danger:true})) { try{ await deleteDoc(doc(db,"polls",el.dataset.id)); toast("ลบแล้ว"); }catch(e){ fail(e);} } },
  delev:async el=>{ if(await ask({title:"ลบกิจกรรมนี้?",body:"คะแนนทั้งหมดจะหายไป",ok:"ลบ",danger:true})) { try{ await deleteDoc(doc(db,"events",el.dataset.id)); toast("ลบแล้ว"); }catch(e){ fail(e);} } },
  evphase:el=>upd("events",el.dataset.id,{phase:el.dataset.v},"อัปเดตสถานะกิจกรรมแล้ว"),
  evcomments:el=>openEvComments(el.dataset.id),
  hide:el=>upd("ideas",el.dataset.id,{hidden:el.dataset.v==="1"},el.dataset.v==="1"?"ซ่อนโพสต์แล้ว":"แสดงโพสต์อีกครั้ง"),
  rewarded:el=>upd("ideas",el.dataset.id,{rewarded:true},"บันทึกการมอบรางวัลแล้ว"),
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]"); if(!el) return;
  if(el.dataset.action==="ovclose"){ if(e.target===el) closeModal(); return; }
  e.stopPropagation(); ACT[el.dataset.action]?.(el,e);
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]"); if(!f) return; e.preventDefault();
  ({ compose:submitIdea, edit:submitEdit, del:submitDelete, comment:submitComment, claim:claimReward, pin:councilLogin })[f.dataset.form]?.(f);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="feedQ"){ S.q=t.value; updateFeedList(); return; }
  if(t.dataset.draft){ S.draft[t.dataset.draft]=t.value; return; }
  if(t.dataset.draftOpt!==undefined){ S.draft.pollOpts[+t.dataset.draftOpt]=t.value; return; }
  if(t.dataset.draftC){ S.draft.compose[t.dataset.draftC]=t.value; const c=t.dataset.draftC==="title"?$("#cTc"):$("#cXc"); if(c) c.textContent=`${t.value.length}/${t.dataset.draftC==="title"?80:600}`; }
});
document.addEventListener("focusout",()=>{ setTimeout(()=>{ if(S.dirty && S.tab!=="feed" && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) renderView(); },150); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#modal-root2").innerHTML){ $("#askNo")?.click(); } else if($("#modal-root").innerHTML) closeModal(); } });
window.addEventListener("hashchange",()=>{ const m=location.hash.match(/idea=([A-Za-z0-9]+)/); if(m && db) openDetail(m[1]); });

/* =====================================================================
   init
   ===================================================================== */
async function init(){
  buildNav(); renderView();
  try{
    const app=initializeApp(firebaseConfig); db=getFirestore(app); auth=getAuth(app);
    await new Promise((res,rej)=>{ onAuthStateChanged(auth,u=>{ if(u){ S.uid=u.uid; res(); } }); signInAnonymously(auth).catch(rej); });
    subscribeAll();
    const m=location.hash.match(/idea=([A-Za-z0-9]+)/); if(m) openDetail(m[1]);
    setInterval(()=>{ const r=roundInfo().id; if(r!==activeRound){ activeRound=r; S.ideas=[]; S.prev=null; S.loaded.ideas=false; subscribeIdeas(); renderView(); } else if(S.tab==="feed") updateHero(); },60000);
  }catch(e){
    console.error(e); S.loaded={ideas:true,polls:true,events:true};
    $("#view").insertAdjacentHTML("afterbegin",`<div class="warnbar" style="margin-top:14px;">${ic("info")}<span>เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ต และเปิด Anonymous sign-in ใน Firebase Authentication</span></div>`);
    refresh();
  }
}
init();
</script>
